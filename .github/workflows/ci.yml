name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run verify
      - name: Market readiness gate
        run: npm run market:readiness

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: End-to-end admin and order flow
        run: npm run test:e2e

      - name: Header and accessibility checks
        run: |
          set -euo pipefail
          npm run build

          nohup npx next start -p 3000 > /tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid
          trap 'kill "$(cat /tmp/next.pid)" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then break; fi
            sleep 1
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:3000/; then
            echo "Server kam nicht hoch:"; cat /tmp/next.log; exit 1
          fi

          npm run test:csp
          npm run test:a11y

      - name: Serverprotokoll bei Fehlschlag
        if: failure()
        run: tail -50 /tmp/next.log || true
