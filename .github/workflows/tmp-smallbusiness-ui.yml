name: Temporary Small Business UI Patch

on:
  push:
    branches: [market-readiness-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-readiness-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch small-business UI defaults and E2E expectation
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replace(path, from, to) {
            let source = fs.readFileSync(path, 'utf8');
            if (!source.includes(from)) throw new Error(`${path}: pattern not found: ${from}`);
            source = source.replace(from, to);
            fs.writeFileSync(path, source);
          }

          replace(
            'app/admin/page.tsx',
            'import { offerPrintHtml, openPrintWindow } from "@/lib/print-template";\n',
            'import { offerPrintHtml, openPrintWindow } from "@/lib/print-template";\nimport { company } from "@/lib/company";\n',
          );
          replace(
            'app/admin/page.tsx',
            'const [offerTax, setOfferTax] = useState("19");',
            'const [offerTax, setOfferTax] = useState(company.smallBusiness ? "0" : "19");',
          );
          replace(
            'app/admin/page.tsx',
            'const taxPercent = parsePercent(offerTax, 19);',
            'const taxPercent = parsePercent(offerTax, company.smallBusiness ? 0 : 19);',
          );
          replace(
            'app/admin/page.tsx',
            'setOfferTax("19");',
            'setOfferTax(company.smallBusiness ? "0" : "19");',
          );

          replace(
            'app/admin/invoices/page.tsx',
            'import { invoicePrintHtml, openPrintWindow } from "@/lib/print-template";\n',
            'import { invoicePrintHtml, openPrintWindow } from "@/lib/print-template";\nimport { company } from "@/lib/company";\n',
          );
          replace(
            'app/admin/invoices/page.tsx',
            'const [taxPercent, setTaxPercent] = useState("19");',
            'const [taxPercent, setTaxPercent] = useState(company.smallBusiness ? "0" : "19");',
          );
          replace(
            'app/admin/invoices/page.tsx',
            'const tax = parsePercent(taxPercent, 19);',
            'const tax = parsePercent(taxPercent, company.smallBusiness ? 0 : 19);',
          );

          replace(
            'tests/e2e/admin-flow.mjs',
            'check("Rechnung berechnet 19 Prozent MwSt korrekt", grossCents === 148631, `gross=${grossCents}`);',
            'check("Kleinunternehmer-Regel erzwingt 0 Prozent Umsatzsteuer", grossCents === 124900 && Number(invoiceBeforePayment?.tax_percent) === 0, `gross=${grossCents}, tax=${invoiceBeforePayment?.tax_percent}`);',
          );
          NODE

      - run: npx prettier --write app/admin/page.tsx app/admin/invoices/page.tsx tests/e2e/admin-flow.mjs
      - name: Commit targeted patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/admin/page.tsx app/admin/invoices/page.tsx tests/e2e/admin-flow.mjs
          git commit -m "Align admin tax UI with small business status"
          git push origin HEAD:market-readiness-v1
