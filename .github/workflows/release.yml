name: Market Release Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm i --no-save playwright @axe-core/playwright
      - run: npx playwright install --with-deps chromium

      - name: Static release checks
        run: npm run release:check

      - name: End-to-end admin and order flow
        run: npm run test:e2e

      - name: CSP and accessibility against production build
        run: |
          set -euo pipefail
          npm run build

          nohup npx next start -p 3000 > /tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid
          trap 'kill "$(cat /tmp/next.pid)" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then break; fi
            sleep 1
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:3000/; then
            echo "Server kam nicht hoch:"
            cat /tmp/next.log
            exit 1
          fi

          npm run test:csp
          npm run test:a11y

      - name: Server log on failure
        if: failure()
        run: tail -80 /tmp/next.log || true

      - name: Release summary
        if: success()
        run: |
          echo "## WebForge Market Release Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Production dependency audit" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Verify" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Market readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ CSP" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Accessibility" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ End-to-end admin and order flow" >> "$GITHUB_STEP_SUMMARY"
